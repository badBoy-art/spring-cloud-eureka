# ===== \u8BED\u97F3\u8BC6\u522B FunASR\uFF08com.example.asr\uFF09=====
# \u603B\u5F00\u5173\uFF1Bfalse \u65F6\u8FDE\u63A5\u6C60\u4E0D\u542F\u52A8\uFF0C\u63A5\u53E3\u76F4\u63A5\u8FD4\u56DE\u964D\u7EA7
asr.enabled=true
# FunASR runtime \u5B9E\u4F8B\u5730\u5740\uFF0C\u591A\u5B9E\u4F8B\u7528\u9017\u53F7\u5206\u9694\uFF1Aws://10.0.0.11:10095,ws://10.0.0.12:10095
asr.endpoints=ws://127.0.0.1:10095
# \u6BCF\u4E2A\u5B9E\u4F8B\u7684\u957F\u8FDE\u63A5\u6570\uFF0C\u5EFA\u8BAE\u7B49\u4E8E\u8BE5\u5B9E\u4F8B run_server.sh --decoder-thread-num
asr.pool-size-per-endpoint=4
# \u5355\u6B21\u8BC6\u522B\u7AEF\u5230\u7AEF\u8D85\u65F6\uFF1A\u7EBF\u4E0A\u77ED\u53E5 500ms\uFF0C\u672C\u5730\u8C03\u8BD5\u653E\u5BBD
asr.request-timeout-ms=3000
asr.send-timeout-ms=500
asr.borrow-timeout-ms=100
asr.connect-timeout-ms=3000
asr.ping-interval-seconds=20
asr.frame-bytes=3200
# \u70ED\u8BCD\u8D70\u9996\u5E27\u4E0B\u53D1\uFF0C\u591A\u5B9E\u4F8B\u5929\u7136\u4E00\u81F4\uFF1B\u6743\u91CD\u9700\u670D\u52A1\u7AEF --lm-dir(FST) \u624D\u751F\u6548
asr.hotwords={"\u8010\u514B":20,"\u963F\u8FEA\u8FBE\u65AF":20}

management.endpoints.jmx.exposure.include=*
spring.jmx.enabled=true


