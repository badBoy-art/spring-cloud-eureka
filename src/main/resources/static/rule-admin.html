<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<title>规则管理台 — Drools 动态规则</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --line:#dfe3e8; --pri:#1f6feb; --ok:#1a7f37; --warn:#9a6700; --err:#cf222e; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:#1f2328; }
  header { background:#0d1117; color:#fff; padding:14px 22px; display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0; font-weight:600; }
  header .pill { background:#21262d; border:1px solid #30363d; border-radius:14px; padding:2px 12px; font-size:12px; }
  header .pill b { color:#7ee787; }
  main { padding:18px 22px 60px; display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  section.card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; }
  section.card h2 { font-size:14px; margin:0 0 12px; padding-bottom:8px; border-bottom:1px solid var(--line); }
  .full { grid-column:1 / -1; }
  label { display:block; font-size:12px; color:#57606a; margin:10px 0 4px; }
  input,select,textarea { width:100%; padding:7px 9px; border:1px solid var(--line); border-radius:6px; font:inherit; background:#fff; }
  textarea { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12px; min-height:170px; }
  button { padding:7px 14px; border:1px solid var(--line); background:#fff; border-radius:6px; cursor:pointer; font:inherit; }
  button.primary { background:var(--pri); border-color:var(--pri); color:#fff; }
  button.danger { color:var(--err); }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:12px; }
  .grid3 { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th,td { border-bottom:1px solid var(--line); padding:7px 8px; text-align:left; vertical-align:top; }
  th { color:#57606a; font-weight:500; background:#fafbfc; }
  .msg { margin-top:10px; padding:9px 11px; border-radius:6px; font-size:13px; white-space:pre-wrap; display:none; }
  .msg.show { display:block; }
  .msg.ok { background:#dafbe1; border:1px solid #aceebb; }
  .msg.err { background:#ffebe9; border:1px solid #ffcecb; }
  .msg.info { background:#ddf4ff; border:1px solid #b6e3ff; }
  code { background:#f0f1f3; padding:1px 5px; border-radius:4px; font-size:12px; }
  .tag { display:inline-block; font-size:11px; padding:1px 7px; border-radius:10px; border:1px solid var(--line); }
  .tag.on { background:#dafbe1; border-color:#aceebb; color:#1a7f37; }
  .tag.off { background:#f6f8fa; color:#57606a; }
  .hint { font-size:12px; color:#57606a; margin-top:6px; }
</style>
</head>
<body>
<header>
  <h1>规则管理台（Drools 动态规则 + 决策表）</h1>
  <span class="pill">生效版本 <b id="st-version">-</b></span>
  <span class="pill">引擎规则数 <b id="st-rules">-</b></span>
  <span class="pill">已发布 <b id="st-published">-</b></span>
  <button onclick="refreshEngine()">强制刷新引擎</button>
</header>

<main>
  <!-- 1. 参数模板化规则 -->
  <section class="card">
    <h2>① 参数模板化规则（运营填参数，系统生成 DRL）</h2>
    <label>规则类型</label>
    <select id="type" onchange="onTypeChange()"></select>
    <div class="hint" id="type-desc"></div>
    <div id="form"></div>
    <div class="hint" id="form-mode"></div>
    <label>规则业务键（同一键重复发布=覆盖并升版本）</label>
    <input id="ruleKey" placeholder="如 vip-2026"/>
    <div class="row">
      <button onclick="preview()">预览 DRL</button>
      <button onclick="trialCompile()">试编译</button>
      <button class="primary" onclick="publishRule()">发布</button>
      <button onclick="resetForm()">清空（新建）</button>
    </div>
    <label>DRL 预览</label>
    <textarea id="drl" readonly placeholder="点“预览 DRL”"></textarea>
    <div class="msg" id="msg1"></div>
  </section>

  <!-- 2. 规则列表 -->
  <section class="card">
    <h2>② 已配置规则（启停立即生效，无需重启）</h2>
    <table>
      <thead><tr><th>规则名</th><th>参数</th><th>版本</th><th>状态</th><th>操作</th></tr></thead>
      <tbody id="rule-list"></tbody>
    </table>
    <div class="msg" id="msg2"></div>
  </section>

  <!-- 3. 决策表 -->
  <section class="card">
    <h2>③ Excel 决策表（业务方只填表格取值）</h2>
    <table>
      <thead><tr><th>资产</th><th>版本</th><th>状态</th><th>更新时间</th><th>操作</th></tr></thead>
      <tbody id="asset-list"></tbody>
    </table>
    <div class="row">
      <input type="file" id="xlsx" accept=".xlsx" style="width:auto"/>
      <button onclick="dtPreview()">上传试编译（看 DRL）</button>
      <button class="primary" onclick="dtPublish()">上传并发布</button>
    </div>
    <div class="hint">取值列受白名单约束（等级只能填允许值、折扣率只能填数字），结构行改动会被拦下。</div>
    <div class="msg" id="msg3"></div>
  </section>

  <!-- 4. 试算 -->
  <section class="card">
    <h2>④ 试算（用当前生效规则跑一单）</h2>
    <div class="grid3">
      <div><label>客户等级</label>
        <select id="r-level"><option>VIP</option><option selected>NORMAL</option><option>GOLD</option><option>BLUE</option></select>
      </div>
      <div><label>区域</label><input id="r-region" value="新疆"/></div>
      <div><label>金额</label><input id="r-amount" value="6000"/></div>
      <div><label>件数</label><input id="r-items" value="3"/></div>
    </div>
    <div class="row"><button class="primary" onclick="runOrder()">试算</button></div>
    <div class="msg" id="msg4"></div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// 页面挂载在 {contextPath}/rule/ui/rule-admin.html，接口都在 {contextPath}/rule/** 下；
// 用页面路径反推 context 前缀（下面各处拼 'rule/xxx'），避免写死 /eurekaclient（各环境 context-path 不同）。
const API_BASE = location.pathname.replace(/\/rule\/ui\/rule-admin\.html$/, '/');

function showMsg(el, text, kind) {
  const node = $(el);
  node.className = 'msg show ' + (kind || 'info');
  node.textContent = text;
}

async function api(path, options) {
  const res = await fetch(API_BASE + path, options);
  const text = await res.text();
  let body;
  try { body = text ? JSON.parse(text) : {}; } catch (e) { body = { error: text }; }
  if (!res.ok) {
    const detail = body.details ? '\n' + (Array.isArray(body.details) ? body.details.join('\n') : JSON.stringify(body.details)) : '';
    throw new Error((body.error || res.status) + detail);
  }
  return body;
}

// ---------- 状态 ----------
async function loadState() {
  const s = await api('rule/state');
  $('st-version').textContent = s.activeVersion;
  $('st-rules').textContent = s.ruleCount;
  $('st-published').textContent = s.publishedRules;
}
async function refreshEngine() {
  try { const s = await api('rule/refresh', { method: 'POST' }); await loadState(); await loadRules();
    showMsg('msg2', '引擎已刷新：版本 ' + s.activeVersion + '，生效规则 ' + s.ruleCount + ' 条', 'ok'); }
  catch (e) { showMsg('msg2', e.message, 'err'); }
}

// ---------- 规则类型 / 动态表单（新建 + 编辑同一套表单） ----------
let types = [];
let rulesCache = [];
/** 非空表示当前表单是在"编辑/覆盖"这条规则，发布后它版本 +1 */
let editingKey = null;

async function loadTypes() {
  types = await api('rule/type/meta');
  $('type').innerHTML = types.map(t => `<option value="${esc(t.ruleType)}">${esc(t.typeName)}（${esc(t.ruleType)}）</option>`).join('');
  onTypeChange();
}
function currentType() { return types.find(t => t.ruleType === $('type').value); }

function onTypeChange() {
  const t = currentType();
  if (!t) return;
  editingKey = null;
  $('type-desc').textContent = t.typeDesc;
  $('form').innerHTML = t.fields.map(f => {
    const id = 'f-' + f.fieldKey;
    let control;
    if (f.fieldType === 'ENUM') {
      control = `<select id="${id}">` + f.enumOptions.split(',').map(o =>
        `<option ${o.trim() === f.defaultValue ? 'selected' : ''}>${esc(o.trim())}</option>`).join('') + `</select>`;
    } else {
      control = `<input id="${id}" value="${esc(f.defaultValue || '')}" placeholder="${esc(f.placeholder || '')}"/>`;
    }
    return `<label>${esc(f.fieldName)} <code>${esc(f.fieldType)}</code>${f.required ? ' *' : ''}</label>${control}`;
  }).join('');
  $('ruleKey').value = t.ruleType.toLowerCase() + '-1';
  $('msg1').className = 'msg';
  renderFormMode();
}

/** 表单模式提示：新建 / 覆盖哪条规则 */
function renderFormMode() {
  const node = $('form-mode');
  if (editingKey) {
    const hit = rulesCache.find(r => r.ruleKey === editingKey);
    node.innerHTML = `当前是<b>编辑并覆盖</b>规则 <code>${esc(editingKey)}</code>（现版本 v${hit ? hit.version : '?'}）—— 发布后版本 +1`;
  } else {
    node.innerHTML = '当前是<b>新建</b>规则：业务键填一个新的（同一类型下条件别和已有规则重复，否则会被拦下）';
  }
}

/** 列表里点"编辑"：把该规则的类型、参数、业务键回填进表单 */
function editRule(id) {
  const rule = rulesCache.find(r => r.id === id);
  if (!rule) { return; }
  $('type').value = rule.ruleType;
  const t = currentType();
  if (!t) { return; }
  $('type-desc').textContent = t.typeDesc;
  // 先把表单按类型重建（onTypeChange 会清掉 editingKey），再回填
  onTypeChange();
  t.fields.forEach(f => {
    const el = $('f-' + f.fieldKey);
    if (el && rule.params[f.fieldKey] != null) { el.value = rule.params[f.fieldKey]; }
  });
  $('ruleKey').value = rule.ruleKey;
  editingKey = rule.ruleKey;
  renderFormMode();
  $('msg1').className = 'msg';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/** 清空回"新建"状态 */
function resetForm() {
  onTypeChange();
  $('drl').value = '';
  $('msg1').className = 'msg';
}

function collectParams() {
  const t = currentType();
  const params = {};
  t.fields.forEach(f => { params[f.fieldKey] = $('f-' + f.fieldKey).value; });
  return params;
}

async function preview() {
  try {
    const r = await api('rule/rule/preview', json({ ruleType: $('type').value, params: collectParams() }));
    $('drl').value = r.drl;
    showMsg('msg1', '参数校验通过，已渲染 DRL', 'ok');
  } catch (e) { showMsg('msg1', e.message, 'err'); }
}

async function trialCompile() {
  try {
    const r = await api('rule/rule/validate', json({ ruleType: $('type').value, params: collectParams() }));
    $('drl').value = r.drl;
    showMsg('msg1', '试编译通过（与现有规则一起编译，无冲突）', 'ok');
  } catch (e) { showMsg('msg1', e.message, 'err'); }
}

async function publishRule() {
  try {
    const r = await api('rule/rule/publish', json({
      ruleType: $('type').value, ruleKey: $('ruleKey').value, params: collectParams(), updatedBy: 'admin'
    }));
    $('drl').value = r.drl;
    showMsg('msg1', `已发布${editingKey ? '（覆盖 ' + editingKey + '）' : '（新建）'}：${r.ruleName}（v${r.version}），生效版本 ${r.activeVersion}，引擎规则数 ${r.ruleCount}`, 'ok');
    await loadRules(); await loadState();
  } catch (e) { showMsg('msg1', e.message, 'err'); }
}

// ---------- 规则列表 ----------
async function loadRules() {
  const list = await api('rule/rule/list');
  rulesCache = list;
  $('rule-list').innerHTML = list.map(r => `
    <tr>
      <td>${esc(r.ruleName)}<div class="hint">${esc(r.hitMessage || '')}</div></td>
      <td><code>${esc(JSON.stringify(r.params))}</code></td>
      <td>v${r.version}</td>
      <td>${r.status === 1 ? '<span class="tag on">生效</span>' : (r.status === 2 ? '<span class="tag off">停用</span>' : '<span class="tag">草稿</span>')}</td>
      <td>
        <button onclick="editRule(${r.id})">编辑</button>
        <button onclick="toggle(${r.id}, ${r.status === 1 ? 2 : 1})">${r.status === 1 ? '停用' : '启用'}</button>
        <button class="danger" onclick="removeRule(${r.id})">删除</button>
      </td>
    </tr>`).join('') || '<tr><td colspan="5">暂无规则</td></tr>';
  renderFormMode();
}
async function toggle(id, status) {
  try { const s = await api('rule/rule/status', json({ id, status })); await loadRules(); await loadState();
    showMsg('msg2', `状态已切换，生效版本 ${s.activeVersion}，引擎规则数 ${s.ruleCount}`, 'ok'); }
  catch (e) { showMsg('msg2', e.message, 'err'); }
}
async function removeRule(id) {
  try { await api('rule/rule/delete', json({ id, status: 0 })); await loadRules(); await loadState(); showMsg('msg2', '已删除并刷新引擎', 'ok'); }
  catch (e) { showMsg('msg2', e.message, 'err'); }
}

// ---------- 决策表 ----------
async function loadAssets() {
  const list = await api('rule/dt/assets');
  $('asset-list').innerHTML = list.map(a => `
    <tr>
      <td>${esc(a.assetName)}<div class="hint">${esc(a.assetKey)}｜条件取值白名单：${esc((a.conditionWhitelist || []).join('/'))}</div></td>
      <td>v${a.version}</td>
      <td>${a.status === 1 ? '<span class="tag on">生效</span>' : '<span class="tag off">未发布</span>'}</td>
      <td>${esc(a.updatedAt || '')}</td>
      <td>
        <a href="${API_BASE}rule/dt/template?assetKey=${encodeURIComponent(a.assetKey)}"><button>下载模板</button></a>
        ${a.status === 1 ? `<button onclick="dtDisable('${esc(a.assetKey)}')">停用</button>` : ''}
      </td>
    </tr>`).join('');
}
async function dtPreview() {
  const asset = (await api('rule/dt/assets'))[0];
  if (!$('xlsx').files.length) { showMsg('msg3', '请先选择 xlsx 文件', 'err'); return; }
  const f = new FormData(); f.append('file', $('xlsx').files[0]);
  try {
    const r = await api('rule/dt/preview?assetKey=' + encodeURIComponent(asset.assetKey), { method: 'POST', body: f });
    showMsg('msg3', '校验通过。该表将编译成以下 DRL：\n\n' + (r.drl || '（DRL 预览不可用）'), 'ok');
  } catch (e) { showMsg('msg3', e.message, 'err'); }
}
async function dtPublish() {
  const asset = (await api('rule/dt/assets'))[0];
  if (!$('xlsx').files.length) { showMsg('msg3', '请先选择 xlsx 文件', 'err'); return; }
  const f = new FormData(); f.append('file', $('xlsx').files[0]);
  try {
    const r = await api('rule/dt/publish?assetKey=' + encodeURIComponent(asset.assetKey), { method: 'POST', body: f });
    showMsg('msg3', `已发布：${r.assetKey} v${r.version}，生效版本 ${r.activeVersion}，引擎规则数 ${r.ruleCount}\n\n生成 DRL：\n` + (r.drl || ''), 'ok');
    await loadAssets(); await loadState(); await loadRules();
  } catch (e) { showMsg('msg3', e.message, 'err'); }
}
async function dtDisable(assetKey) {
  try { await api('rule/dt/disable?assetKey=' + encodeURIComponent(assetKey), { method: 'POST' });
    await loadAssets(); await loadState(); await loadRules(); showMsg('msg3', '已停用该决策表', 'ok'); }
  catch (e) { showMsg('msg3', e.message, 'err'); }
}

// ---------- 试算 ----------
async function runOrder() {
  try {
    const r = await api('rule/run', json({
      customerLevel: $('r-level').value, region: $('r-region').value,
      amount: parseFloat($('r-amount').value), itemCount: parseInt($('r-items').value, 10)
    }));
    showMsg('msg4', [
      `命中规则(${r.firedCount}): ${r.firedRules.join(', ') || '无'}`,
      ...r.messages,
      `折扣: ${r.discount}   运费: ${r.shippingFee}   拦截: ${r.rejected}   大额标记: ${r.bigOrder}`,
      `最终应付: ${r.finalAmount}`
    ].join('\n'), 'ok');
  } catch (e) { showMsg('msg4', e.message, 'err'); }
}

function json(body) {
  return { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) };
}

(async function init() {
  try { await loadTypes(); await loadRules(); await loadAssets(); await loadState(); }
  catch (e) { showMsg('msg1', '初始化失败: ' + e.message, 'err'); }
})();
</script>
</body>
</html>
